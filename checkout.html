<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALLAPU - Checkout</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  color: #222;
}

header {
  background: #6c2bd9;
  color: white;
  padding: 18px;
  text-align: center;
}

.container {
  max-width: 650px;
  margin: 20px auto;
  padding: 16px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px #00000010;
}

h2 {
  margin-top: 0;
  color: #5520b5;
}

label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

button, .link-button {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  background: #6c2bd9;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}

.secondary {
  background: #333;
}

#notice {
  display: none;
  padding: 14px;
  border-radius: 8px;
  background: #fff3cd;
  color: #664d03;
  line-height: 1.5;
}

.item {
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.total {
  font-size: 20px;
  font-weight: bold;
  margin-top: 16px;
}
</style>
</head>

<body>

<header>
  <h1>🛍️ PALLAPU</h1>
  <p>Delivery Details</p>
</header>

<main class="container">

  <section class="card">
    <h2>📦 Delivery Address</h2>

    <form id="checkoutForm">

      <label for="name">Full Name</label>
      <input id="name" name="name" type="text"
             autocomplete="name" required>

      <label for="phone">Mobile Number</label>
      <input id="phone" name="phone" type="tel"
             inputmode="numeric" pattern="[0-9]{10}"
             maxlength="10" autocomplete="tel"
             placeholder="10-digit mobile number" required>

      <label for="address">House Number and Street</label>
      <textarea id="address" name="address" rows="2"
                autocomplete="street-address" required></textarea>

      <label for="village">Village / Town</label>
      <input id="village" name="village"
             autocomplete="address-level3" required>

      <label for="district">District</label>
      <input id="district" name="district"
             autocomplete="address-level2" required>

      <label for="state">State</label>
      <select id="state" name="state" required>
        <option value="">Select State</option>
        <option>Telangana</option>
        <option>Andhra Pradesh</option>
        <option>Karnataka</option>
        <option>Tamil Nadu</option>
        <option>Maharashtra</option>
        <option>Kerala</option>
        <option>Other</option>
      </select>

      <label for="pincode">PIN Code</label>
      <input id="pincode" name="pincode" type="text"
             inputmode="numeric" pattern="[0-9]{6}"
             maxlength="6" autocomplete="postal-code"
             placeholder="6-digit PIN code" required>

      <button type="submit">Continue</button>
    </form>

    <div id="notice" role="status"></div>
  </section>

  <section class="card">
    <h2>🛒 Order Summary</h2>
    <div id="items">Loading cart...</div>
    <div class="total" id="total">Total: ₹0</div>

    <a class="link-button secondary" href="cart.html">
      ← Back to Cart
    </a>

    <a class="link-button secondary" href="index.html">
      Continue Shopping
    </a>
  </section>

</main>

<script>
const cartKey = "pallapuCart";
const itemsBox = document.getElementById("items");
const totalBox = document.getElementById("total");

function getCart() {
  try {
    const cart = JSON.parse(localStorage.getItem(cartKey) || "[]");
    return Array.isArray(cart) ? cart : [];
  } catch {
    return [];
  }
}

function showCart() {
  const cart = getCart();
  itemsBox.innerHTML = "";

  if (cart.length === 0) {
    itemsBox.textContent = "Your cart is empty.";
    totalBox.textContent = "Total: ₹0";
    return;
  }

  let total = 0;

  cart.forEach(item => {
    const price = Number(item.price) || 0;
    const qty = Math.max(1, Number(item.qty) || 1);
    const lineTotal = price * qty;
    total += lineTotal;

    const row = document.createElement("div");
    row.className = "item";

    const title = document.createElement("div");
    title.textContent =
      (item.name || item.title || "Product") +
      " × " + qty;

    const amount = document.createElement("div");
    amount.textContent = "₹" + lineTotal.toLocaleString("en-IN");

    row.append(title, amount);
    itemsBox.appendChild(row);
  });

  totalBox.textContent =
    "Subtotal: ₹" + total.toLocaleString("en-IN");
}

document.getElementById("checkoutForm").addEventListener("submit", function(event) {
  event.preventDefault();

  if (getCart().length === 0) {
    alert("Your cart is empty. Please add products first.");
    return;
  }

  const notice = document.getElementById("notice");
  notice.style.display = "block";
  notice.textContent =
    "Checkout page demo is working, but your order has NOT been placed or saved. " +
    "PALLAPU still needs a secure backend to store orders and delivery details.";
  notice.scrollIntoView({ behavior: "smooth", block: "center" });
});

showCart();
</script>

</body>
</html>
