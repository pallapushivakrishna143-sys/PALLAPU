<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALLAPU Shopping</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#222}
header{background:#5424a8;color:white;padding:20px 16px}
header h1{margin:0;font-size:27px;letter-spacing:1px}
header p{margin:6px 0 0;font-size:13px}
.search{padding:15px;background:white}
.search input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:15px}
h2{font-size:19px;margin:20px 15px 12px}
.categories{display:flex;gap:10px;overflow-x:auto;padding:0 15px}
.category{background:white;padding:15px 18px;border-radius:12px;min-width:95px;text-align:center;font-size:13px;box-shadow:0 2px 8px #ddd}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 80px}
.product{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #ddd}
.product img{width:100%;height:135px;object-fit:cover;background:#eee}
.details{padding:11px}
.details h3{font-size:14px;margin:0 0 8px}
.price{font-weight:bold;color:#5424a8;font-size:17px}
button{border:0;background:#5424a8;color:white;padding:10px;border-radius:7px;width:100%;margin-top:10px}
nav{position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:space-around;background:white;padding:12px 0;box-shadow:0 -2px 10px #ddd}
nav a{text-decoration:none;color:#5424a8;font-size:12px;text-align:center}
</style>
</head>
<body>
<header>
<h1>PALLAPU</h1>
<p>Everything you love, in one place.</p>
</header>
<div class="search">
<input id="search" type="search" placeholder="Search products..." oninput="filterProducts()">
</div>
<h2>Shop by Category</h2>
<div class="categories">
<div class="category">👕<br>Fashion</div>
<div class="category">📱<br>Electronics</div>
<div class="category">🏠<br>Home</div>
<div class="category">💄<br>Beauty</div>
<div class="category">👟<br>Footwear</div>
</div>
<h2>Featured Products</h2>
<div class="products" id="products">
<div class="product" data-name="Classic T-Shirt">
<img src="https://placehold.co/400x300/f0e6ff/5424a8?text=T-Shirt" alt="T-Shirt">
<div class="details"><h3>Classic T-Shirt</h3><div class="price">₹399</div><button onclick="addToCart('Classic T-Shirt')">Add to Cart</button></div>
</div>
<div class="product" data-name="Wireless Headphones">
<img src="https://placehold.co/400x300/e6f4ff/225588?text=Headphones" alt="Headphones">
<div class="details"><h3>Wireless Headphones</h3><div class="price">₹999</div><button onclick="addToCart('Wireless Headphones')">Add to Cart</button></div>
</div>
<div class="product" data-name="Casual Shoes">
<img src="https://placehold.co/400x300/fff0e6/884422?text=Shoes" alt="Shoes">
<div class="details"><h3>Casual Shoes</h3><div class="price">₹799</div><button onclick="addToCart('Casual Shoes')">Add to Cart</button></div>
</div>
<div class="product" data-name="Smart Watch">
<img src="https://placehold.co/400x300/e6fff0/226644?text=Smart+Watch" alt="Smart Watch">
<div class="details"><h3>Smart Watch</h3><div class="price">₹1499</div><button onclick="addToCart('Smart Watch')">Add to Cart</button></div>
</div>
</div>
<nav>
<a href="#">🏠<br>Home</a>
<a href="#products">🛍️<br>Products</a>
<a href="#" onclick="showCart()">🛒<br>Cart</a>
<a href="#" onclick="showAccount()">👤<br>Account</a>
</nav>
<script>
let cart=[];
function addToCart(name){
cart.push(name);
alert(name+" added to cart!");
}
function showCart(){
alert(cart.length ? "Your cart:\\n"+cart.join("\\n") : "Your cart is empty.");
}
function showAccount(){
alert("Customer and Seller accounts will be added in the next development step.");
}
function filterProducts(){
const q=document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".product").forEach(p=>{
p.style.display=p.dataset.name.toLowerCase().includes(q)?"block":"none";
});
}
</script>
</body>
</html>
