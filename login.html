<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PALLAPU Login</title>
<style>
body{font-family:Arial;background:#f4f5f9;margin:0;color:#222}
header{background:#5624b8;color:white;padding:20px;text-align:center}
main{max-width:440px;margin:25px auto;padding:18px}
.card{background:white;padding:22px;border-radius:12px;box-shadow:0 2px 10px #0001}
input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:7px;font-size:16px}
input,select{border:1px solid #ccc}
button{border:0;background:#5624b8;color:white;font-weight:bold}
.secondary{background:#444}
#message{overflow-wrap:anywhere;line-height:1.5}
a{color:#5624b8}
</style>
</head>
<body>
<header>
<h1>🛍️ PALLAPU</h1>
<p>Customer & Seller Account</p>
</header>

<main>
<section class="card">
<h2>Create Account / Login</h2>

<label for="role">Account Type</label>
<select id="role">
<option value="customer">Customer</option>
<option value="seller">Seller</option>
</select>

<label for="name">Full Name (for registration)</label>
<input id="name" autocomplete="name" placeholder="Full name">

<label for="email">Email</label>
<input id="email" type="email" autocomplete="email" required placeholder="you@example.com">

<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password"
       minlength="6" required placeholder="At least 6 characters">

<button id="register">Create Account</button>
<button id="login">Login</button>
<button id="logout" class="secondary" hidden>Logout</button>

<p id="message" role="status">Connecting to PALLAPU account service...</p>
<p><a href="index.html">← Back to Store</a></p>
</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  updateProfile
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC2fEW-8jb-Wc6x5s3LjDpQtxLVvSp9ZUg",
  authDomain: "pallapu-online-shopping.firebaseapp.com",
  projectId: "pallapu-online-shopping",
  storageBucket: "pallapu-online-shopping.firebasestorage.app",
  messagingSenderId: "688226618402",
  appId: "1:688226618402:web:1aaa2e3cdb1f106b1b0e7b",
  measurementId: "G-3K56RW8H51"
};

const message = document.getElementById("message");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const nameInput = document.getElementById("name");
const roleInput = document.getElementById("role");
const registerButton = document.getElementById("register");
const loginButton = document.getElementById("login");
const logoutButton = document.getElementById("logout");

let auth;

try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  message.textContent = "Firebase connected. You can register or login.";
} catch (error) {
  message.textContent = "Firebase setup error: " + error.message;
}

registerButton.addEventListener("click", async () => {
  const name = nameInput.value.trim();
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!name) {
    message.textContent = "Please enter your full name.";
    return;
  }
  if (!email || password.length < 6) {
    message.textContent = "Enter a valid email and password of at least 6 characters.";
    return;
  }

  registerButton.disabled = true;
  try {
    const credential = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(credential.user, { displayName: name });

    // Role is only a UI preference. It does NOT grant trusted seller/admin permissions.
    message.textContent =
      "Account created successfully! Signed in as " + credential.user.email +
      ". Selected account type: " + roleInput.value +
      ". Seller approval and secure role management must be configured separately.";
  } catch (error) {
    message.textContent = "Registration failed: " + error.message;
  } finally {
    registerButton.disabled = false;
  }
});

loginButton.addEventListener("click", async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    message.textContent = "Enter your email and password.";
    return;
  }

  loginButton.disabled = true;
  try {
    const credential = await signInWithEmailAndPassword(auth, email, password);
    message.textContent = "Login successful! Welcome, " +
      (credential.user.displayName || credential.user.email) + ".";
  } catch (error) {
    message.textContent = "Login failed: " + error.message;
  } finally {
    loginButton.disabled = false;
  }
});

logoutButton.addEventListener("click", async () => {
  try {
    await signOut(auth);
    message.textContent = "You have logged out.";
  } catch (error) {
    message.textContent = "Logout failed: " + error.message;
  }
});

if (auth) {
  onAuthStateChanged(auth, user => {
    logoutButton.hidden = !user;
    if (user) {
      message.textContent = "Signed in as " + user.email + ".";
    }
  });
}
</script>
</body>
</html>
