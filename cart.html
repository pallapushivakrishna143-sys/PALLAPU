<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALLAPU - Shopping Cart</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#222;
}
header{
  background:#5422a8;
  color:white;
  padding:20px;
  text-align:center;
}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}
.container{
  max-width:750px;
  margin:20px auto;
  padding:15px;
}
.card{
  background:white;
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 8px #0000000c;
}
.item{
  display:flex;
  gap:12px;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:14px 0;
}
.icon{
  min-width:65px;
  height:65px;
  border-radius:10px;
  background:#f0eafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
}
.details{flex:1;min-width:0}
.details h3{margin:0 0 7px;font-size:16px}
.price{color:#16803c;font-weight:bold}
.quantity{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}
.quantity button{
  width:32px;
  height:32px;
  border:0;
  border-radius:6px;
  background:#eee7fb;
  color:#5422a8;
  font-size:18px;
}
.remove{
  border:0;
  background:none;
  color:#c62828;
  margin-top:8px;
  padding:4px 0;
}
.total-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:12px 0;
}
.grand{
  border-top:1px solid #ddd;
  padding-top:15px;
  font-size:20px;
  font-weight:bold;
}
.primary,.secondary{
  display:block;
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  margin-top:12px;
  text-align:center;
  text-decoration:none;
}
.primary{background:#5422a8;color:white}
.secondary{background:#eee7fb;color:#5422a8}
.empty{
  text-align:center;
  padding:30px 10px;
}
.empty div{font-size:55px;margin-bottom:10px}
footer{text-align:center;padding:20px;color:#777;font-size:13px}
</style>
</head>

<body>

<header>
  <h1>PALLAPU</h1>
  <p>🛒 Your Shopping Cart</p>
</header>

<main class="container">

  <section class="card">
    <h2>My Cart</h2>
    <p id="itemCount">0 items</p>
    <div id="cartItems"></div>
    <div id="emptyCart" class="empty" style="display:none">
      <div>🛒</div>
      <h3>Your cart is empty</h3>
      <p>Add products from PALLAPU Shopping.</p>
      <a class="primary" href="index.html">Continue Shopping</a>
    </div>
  </section>

  <section class="card" id="summary">
    <h2>Price Details</h2>

    <div class="total-row">
      <span>Subtotal</span>
      <span id="subtotal">₹0</span>
    </div>

    <div class="total-row">
      <span>Delivery</span>
      <span id="delivery">₹0</span>
    </div>

    <div class="total-row grand">
      <span>Total Amount</span>
      <span id="grandTotal">₹0</span>
    </div>

    <button class="primary" onclick="checkout()">
      Continue to Checkout
    </button>

    <a class="secondary" href="index.html">
      Continue Shopping
    </a>

    <p style="font-size:12px;color:#777;line-height:1.5">
      Demo only. Checkout and payments are not connected yet.
    </p>
  </section>

</main>

<footer>
  © 2026 PALLAPU. All rights reserved.
</footer>

<script>
let cart = [];

function loadCart(){
  try{
    const saved = JSON.parse(
      localStorage.getItem("pallapuCart") || "[]"
    );
    cart = Array.isArray(saved) ? saved : [];
  }catch(e){
    cart = [];
  }

  cart = cart.filter(item =>
    item &&
    Number.isFinite(Number(item.price)) &&
    Number(item.price) >= 0 &&
    Number(item.quantity) > 0
  );

  cart.forEach(item => {
    item.id = Number(item.id);
    item.price = Number(item.price);
    item.quantity = Math.floor(Number(item.quantity));
  });
}

function saveCart(){
  try{
    localStorage.setItem("pallapuCart",JSON.stringify(cart));
  }catch(e){}
}

function money(amount){
  return "₹" + amount.toLocaleString("en-IN");
}

function renderCart(){
  const container = document.getElementById("cartItems");
  const empty = document.getElementById("emptyCart");
  const summary = document.getElementById("summary");

  const totalItems = cart.reduce(
    (sum,item) => sum + item.quantity,0
  );

  const subtotal = cart.reduce(
    (sum,item) => sum + item.price * item.quantity,0
  );

  document.getElementById("itemCount").textContent =
    totalItems + (totalItems === 1 ? " item" : " items");

  document.getElementById("subtotal").textContent =
    money(subtotal);

  document.getElementById("delivery").textContent =
    "Calculated at checkout";

  document.getElementById("grandTotal").textContent =
    money(subtotal);

  if(cart.length === 0){
    container.innerHTML = "";
    empty.style.display = "block";
    summary.style.display = "none";
    return;
  }

  empty.style.display = "none";
  summary.style.display = "block";

  container.innerHTML = cart.map((item,index) => `
    <article class="item">
      <div class="icon">${safeText(item.icon || "🛍️")}</div>

      <div class="details">
        <h3>${safeText(item.name || "Product")}</h3>
        <div class="price">${money(item.price)}</div>

        <div class="quantity">
          <button onclick="changeQuantity(${index},-1)"
            aria-label="Decrease quantity">−</button>

          <span>${item.quantity}</span>

          <button onclick="changeQuantity(${index},1)"
            aria-label="Increase quantity">+</button>
        </div>

        <button class="remove" onclick="removeItem(${index})">
          🗑️ Remove
        </button>
      </div>

      <strong>${money(item.price * item.quantity)}</strong>
    </article>
  `).join("");
}

function safeText(value){
  const div = document.createElement("div");
  div.textContent = String(value);
  return div.innerHTML;
}

function changeQuantity(index,amount){
  if(!cart[index]) return;

  cart[index].quantity += amount;

  if(cart[index].quantity <= 0){
    cart.splice(index,1);
  }

  saveCart();
  renderCart();
}

function removeItem(index){
  cart.splice(index,1);
  saveCart();
  renderCart();
}

function checkout(){
  if(cart.length === 0){
    alert("Your cart is empty. Add products first.");
    return;
  }

  alert(
    "Your cart is ready! Online checkout, address collection " +
    "and payments will be added after secure backend setup."
  );
}

loadCart();
renderCart();
</script>

</body>
</html>
